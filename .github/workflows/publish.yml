name: publish

# Storage backend is selected with the STORAGE_BACKEND repository variable:
#   github (default) - commit the cache to this repository, served via raw.githubusercontent.com
#   azure-blob       - upload to Azure Blob Storage (AZURE_STORAGE_ACCOUNT, AZURE_STORAGE_CONTAINER)
#   s3               - sync to an S3-compatible bucket with rclone (S3_BUCKET, S3_ENDPOINT, S3_PROVIDER)
#   cloudflare-r2    - sync to Cloudflare R2, then set the source version header and purge the CDN
#                      (S3_BUCKET, S3_ENDPOINT, CLOUDFLARE_PUBLIC_URL, CLOUDFLARE_RULE_URL)
# Signing backend is selected with the SIGNING_BACKEND repository variable:
#   trusted-signing  - Azure Trusted Signing (AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE)
#   azuresigntool    - AzureSignTool with an Azure Key Vault certificate (KEY_VAULT_URL, KEY_VAULT_CERT)
# See the README for the full setup guide. The steps are shared from pl4nty/winget-extras.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yml'
      - 'index/**'
      - 'manifests/**'
      - 'fonts/**'
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    name: Merge Manifests
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Merge manifests
        uses: pl4nty/winget-extras/.github/actions/merge@65eeb0a4079a8d6086f61f719161dcf0ccca7173 # main

      - parallel:
          - name: Upload merged manifests
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
              name: merged-manifests
              path: ${{ runner.temp }}/manifests
              include-hidden-files: true
              if-no-files-found: error

          - name: Upload index
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
              name: index
              path: index
              if-no-files-found: error

  publish:
    name: Publish Manifests
    needs: merge
    runs-on: windows-2025
    permissions:
      id-token: write # OIDC login to Azure for signing and storage backends
    steps:
      - parallel:
          - name: Download index
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            with:
              name: index
              path: index

          - name: Download merged manifests
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            with:
              name: merged-manifests
              path: ${{ runner.temp }}/manifests

      - name: Publish source
        uses: pl4nty/winget-extras/.github/actions/publish@65eeb0a4079a8d6086f61f719161dcf0ccca7173 # main
        with:
          index-tool-repo: ${{ vars.INDEX_TOOL_REPO || 'pl4nty/winget-pkgs-selfhost' }}
          signing-backend: ${{ vars.SIGNING_BACKEND }}
          storage-backend: ${{ vars.STORAGE_BACKEND || 'github' }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          azure-signing-endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          azure-signing-account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          azure-signing-profile: ${{ vars.AZURE_SIGNING_PROFILE }}
          key-vault-url: ${{ vars.KEY_VAULT_URL }}
          key-vault-cert: ${{ vars.KEY_VAULT_CERT }}
          azure-storage-account: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          azure-storage-container: ${{ vars.AZURE_STORAGE_CONTAINER || 'cache' }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-endpoint: ${{ vars.S3_ENDPOINT }}
          s3-provider: ${{ vars.S3_PROVIDER || 'AWS' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          cloudflare-public-url: ${{ vars.CLOUDFLARE_PUBLIC_URL }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-rule-url: ${{ vars.CLOUDFLARE_RULE_URL }}

  commit:
    name: Publish source (GitHub)
    needs: publish
    if: github.ref == 'refs/heads/main' && (vars.STORAGE_BACKEND == '' || vars.STORAGE_BACKEND == 'github')
    runs-on: ubuntu-slim
    permissions:
      contents: write # push the regenerated cache back to the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] credentials are required to push the cache

      - name: Replace cache
        run: rm -rf cache

      - name: Download cache
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cache
          path: cache

      - name: Commit and push cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all cache
          if git diff --cached --quiet; then
            echo 'Cache unchanged, nothing to commit'
            exit 0
          fi
          git commit -m 'chore: regenerate cache'
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
