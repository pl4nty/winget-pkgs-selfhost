name: publish

# Storage backend is selected with the STORAGE_BACKEND repository variable:
#   github (default) - commit the cache to this repository, served via raw.githubusercontent.com
#   azure-blob       - upload to Azure Blob Storage (AZURE_STORAGE_ACCOUNT, AZURE_STORAGE_CONTAINER)
#   s3               - sync to an S3-compatible bucket with rclone (S3_BUCKET, S3_ENDPOINT, S3_PROVIDER)
# Signing backend is selected with the SIGNING_BACKEND repository variable:
#   trusted-signing  - Azure Trusted Signing (AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE)
#   azuresigntool    - AzureSignTool with an Azure Key Vault certificate (KEY_VAULT_URL, KEY_VAULT_CERT)
# See the README for the full setup guide.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yml'
      - 'index/**'
      - 'manifests/**'
      - 'fonts/**'
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    name: Merge Manifests
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Merge manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./.github/workflows/merge.ps1

      - parallel:
          - name: Upload merged manifests
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
              name: merged-manifests
              path: ${{ runner.temp }}/manifests
              include-hidden-files: true
              if-no-files-found: error

          - name: Upload index
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
              name: index
              path: index
              if-no-files-found: error

  publish:
    name: Publish Manifests
    needs: merge
    runs-on: windows-2025
    permissions:
      id-token: write # OIDC login to Azure for signing and storage backends
    defaults:
      run:
        shell: pwsh
    env:
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Checkout mise configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            mise.lock
            mise.toml
          sparse-checkout-cone-mode: false

      - parallel:
          - name: Download index
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            with:
              name: index
              path: index

          - name: Download merged manifests
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            with:
              name: merged-manifests
              path: ${{ runner.temp }}/manifests

          - name: Download IndexCreationTool
            shell: bash
            run: |
              gh release download --repo "$INDEX_TOOL_REPO" --pattern AppInstallerCLIE2ETests.zip
              7z x ./AppInstallerCLIE2ETests.zip -o"./index" -y
            env:
              GITHUB_TOKEN: ${{ github.token }}
              INDEX_TOOL_REPO: ${{ vars.INDEX_TOOL_REPO || 'pl4nty/winget-pkgs-selfhost' }}

          - name: Install Tools
            if: vars.STORAGE_BACKEND == 's3' || vars.SIGNING_BACKEND == 'azuresigntool'
            uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
            with:
              version: 2026.10.17
              install_args: >-
                ${{ vars.STORAGE_BACKEND == 's3' && 'rclone' || '' }}
                ${{ vars.SIGNING_BACKEND == 'azuresigntool' && 'aqua:vcsjones/AzureSignTool' || '' }}

      - parallel:
          - name: Setup and run IndexCreationTool
            working-directory: index
            run: |
              $now = [DateTime]::UtcNow
              $build = ($now.Day * 100) + $now.Hour
              $revision = ($now.Minute * 100) + $now.Second
              $version = "$($now.Year).$($now.Month).$build.$revision"

              (Get-Content -Path AppxManifest.xml) -replace "<VERSION>", $version | Set-Content -Path AppxManifest.xml
              .\AppInstallerCLIE2ETests\IndexCreationTool.exe -f source.json
            env:
              TEMP: ${{ runner.temp }}

          - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
            if: github.ref == 'refs/heads/main' && (vars.SIGNING_BACKEND != '' || vars.STORAGE_BACKEND == 'azure-blob')
            with:
              client-id: ${{ vars.AZURE_CLIENT_ID }}
              tenant-id: ${{ vars.AZURE_TENANT_ID }}
              subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
              allow-no-subscriptions: true

      - name: Sign source package (Trusted Signing)
        if: github.ref == 'refs/heads/main' && vars.SIGNING_BACKEND == 'trusted-signing'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2 # zizmor: ignore[unpinned-uses]
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: index/cache
          files-folder-filter: msix
          files-folder-recurse: true
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Sign source package (AzureSignTool)
        working-directory: index
        if: github.ref == 'refs/heads/main' && vars.SIGNING_BACKEND == 'azuresigntool'
        run: |
          $msixFiles = Get-ChildItem cache -Recurse -Filter *.msix | Select-Object -ExpandProperty FullName
          AzureSignTool sign -kvu $env:KEY_VAULT_URL -kvc $env:KEY_VAULT_CERT -kvm -tr http://timestamp.acs.microsoft.com -td sha256 -fd sha256 $msixFiles
        env:
          KEY_VAULT_URL: ${{ vars.KEY_VAULT_URL }}
          KEY_VAULT_CERT: ${{ vars.KEY_VAULT_CERT }}

      - name: Publish source (Azure Blob Storage)
        working-directory: index
        if: github.ref == 'refs/heads/main' && vars.STORAGE_BACKEND == 'azure-blob'
        run: |
          az storage blob upload-batch `
            --source cache `
            --destination $env:AZURE_STORAGE_CONTAINER `
            --account-name $env:AZURE_STORAGE_ACCOUNT `
            --auth-mode login `
            --overwrite
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER || 'cache' }}

      - name: Publish source (S3)
        working-directory: index
        if: vars.STORAGE_BACKEND == 's3'
        run: rclone sync cache remote:$env:S3_BUCKET/cache --checksum --fast-list $env:DRY_RUN
        env:
          DRY_RUN: ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_REMOTE_TYPE: s3
          RCLONE_CONFIG_REMOTE_PROVIDER: ${{ vars.S3_PROVIDER || 'AWS' }}
          RCLONE_CONFIG_REMOTE_ENV_AUTH: 'true'
          RCLONE_CONFIG_REMOTE_ENDPOINT: ${{ vars.S3_ENDPOINT }}

      - name: Upload cache
        if: vars.STORAGE_BACKEND == '' || vars.STORAGE_BACKEND == 'github'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache
          path: index/cache
          if-no-files-found: error

  commit:
    name: Publish source (GitHub)
    needs: publish
    if: github.ref == 'refs/heads/main' && (vars.STORAGE_BACKEND == '' || vars.STORAGE_BACKEND == 'github')
    runs-on: ubuntu-slim
    permissions:
      contents: write # push the regenerated cache back to the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] credentials are required to push the cache

      - name: Replace cache
        run: rm -rf cache

      - name: Download cache
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cache
          path: cache

      - name: Commit and push cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all cache
          if git diff --cached --quiet; then
            echo 'Cache unchanged, nothing to commit'
            exit 0
          fi
          git commit -m 'chore: regenerate cache'
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
