name: main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  main:
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Setup and run IndexCreationTool
        run: |
          Invoke-WebRequest "${{ github.server_url }}/${{ github.repository }}/releases/latest/download/AppInstallerCLIE2ETests.zip" -OutFile ..\AppInstallerCLIE2ETests.zip
          Expand-Archive ..\AppInstallerCLIE2ETests.zip -DestinationPath ..\
          ..\AppInstallerCLIE2ETests\IndexCreationTool.exe -f source.json
        env:
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}

      # - uses: azure/login@v1
